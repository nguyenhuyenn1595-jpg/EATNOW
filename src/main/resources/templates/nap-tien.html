<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nạp tiền - EatNow</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <nav class="navbar">
        <div class="navbar-logo">
            <div class="logo-box">EN</div>
            <div class="logo-text">
                <h1>EATNOW</h1>
                <p>Nạp tiền vào ví</p>
            </div>
        </div>
        <div class="navbar-menu">
            <a th:href="@{/menu}">Quay lại</a>
        </div>
    </nav>

    <div class="container">

        <div style="max-width: 500px; margin: 60px auto; background: white; padding: 40px; border-radius: 20px; box-shadow: 0 5px 25px rgba(0,0,0,0.08); text-align: center;">

            <h1 style="font-size: 28px; color: #1e2a3a; margin-bottom: 10px;">💰 Nạp tiền vào ví</h1>

            <p style="color: #6b7280; margin-bottom: 30px;">
                Số dư hiện tại:
                <strong style="color: #ff6b35; font-size: 22px;"
                        th:text="${#numbers.formatDecimal(nguoiDung.soDuVi, 0, 'COMMA', 0, 'POINT')} + 'đ'">
                    0đ
                </strong>
            </p>

            <div style="display: flex; flex-direction: column; gap: 12px;">

                <a th:href="@{/nap-tien/xac-nhan(amount=50000)}"
                   style="background: linear-gradient(135deg, #ff6b35, #f7931e); color: white; padding: 15px; border-radius: 12px; text-decoration: none; font-weight: 700; font-size: 16px; box-shadow: 0 4px 12px rgba(255,107,53,0.3);">
                    + Nạp 50,000đ
                </a>

                <a th:href="@{/nap-tien/xac-nhan(amount=100000)}"
                   style="background: linear-gradient(135deg, #ff6b35, #f7931e); color: white; padding: 15px; border-radius: 12px; text-decoration: none; font-weight: 700; font-size: 16px; box-shadow: 0 4px 12px rgba(255,107,53,0.3);">
                    + Nạp 100,000đ
                </a>

                <a th:href="@{/nap-tien/xac-nhan(amount=200000)}"
                   style="background: linear-gradient(135deg, #ff6b35, #f7931e); color: white; padding: 15px; border-radius: 12px; text-decoration: none; font-weight: 700; font-size: 16px; box-shadow: 0 4px 12px rgba(255,107,53,0.3);">
                    + Nạp 200,000đ
                </a>

            </div>

            

        </div>

    </div>
    <div th:replace="~{footer :: footer}"></div>

</body>
</html>
